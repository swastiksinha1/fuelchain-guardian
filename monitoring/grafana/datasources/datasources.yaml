apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL
    type: postgres
    url: postgres:5432
    database: fuelchain
    user: fuelchain
    secureJsonData:
      password: secret
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      postgresVersion: 1500
      timescaledb: true
    editable: false
