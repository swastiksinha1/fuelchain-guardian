[metadata]
name = fuelchain-backend
version = 1.0.0
description = FuelChain Guardian backend services
author = Rishi Raj
python_requires = >=3.11

[options]
packages = find:
include_package_data = True

[tool:pytest]
asyncio_mode = auto
testpaths = ../tests
python_files = test_*.py
python_functions = test_*

[flake8]
max-line-length = 100
extend-ignore = E203, E501, W503
exclude = __pycache__, .git, migrations

[isort]
profile = black
known_first_party = shared,ais_ingestion,disruption,inventory,panic_nlp,credit,websocket_gateway,firestore_sync,app

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
