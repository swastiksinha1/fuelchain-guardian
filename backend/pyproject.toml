[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B904"]
exclude = ["migrations/", "__pycache__/"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
