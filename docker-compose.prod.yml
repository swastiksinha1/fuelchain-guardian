version: "3.9"
# docker-compose.prod.yml
# Use: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from dev:
#  - No volume mounts (use baked images)
#  - Gunicorn multi-worker for backend
#  - No pgAdmin / Redpanda Console (save resources)
#  - Resource limits tightened

services:
  backend:
    image: ${BACKEND_IMAGE:-fuelchain/backend:latest}
    command: >
      gunicorn app.main:app
      -w 4 -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --access-logfile -
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  panic-nlp:
    image: ${BACKEND_NLP_IMAGE:-fuelchain/backend-nlp:latest}
    command: >
      gunicorn panic_nlp.service:app
      -w 2 -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8001
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  frontend:
    image: ${FRONTEND_IMAGE:-fuelchain/frontend:latest}
    ports:
      - "80:80"
      - "443:443"

  pgadmin:
    profiles: ["debug"]  # Only start with --profile debug

  redpanda-console:
    profiles: ["debug"]
