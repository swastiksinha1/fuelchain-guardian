[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO

[tool.pytest.ini_options]
markers = [
    "asyncio: mark test as async",
    "docker: mark test as requiring Docker Compose stack",
    "slow: mark test as slow",
]
