---
# PostgreSQL with TimescaleDB — StatefulSet for production
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fuelchain
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: timescale/timescaledb-ha:pg15-latest
          env:
            - name: POSTGRES_USER
              value: fuelchain
            - name: POSTGRES_DB
              value: fuelchain
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fuelchain-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /home/postgres/pgdata/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "fuelchain"]
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fuelchain"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2   # Change to your cluster's StorageClass
        resources:
          requests:
            storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fuelchain
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
  clusterIP: None  # Headless for StatefulSet

---
# Redis — Deployment (for HA use Redis Sentinel or Redis Cluster Operator)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fuelchain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --maxmemory 512mb
            - --maxmemory-policy allkeys-lru
            - --save ""
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 768Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fuelchain
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP

---
# Redpanda — StatefulSet (single broker for staging, 3 for production)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: fuelchain
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v23.3.11
          command:
            - redpanda
            - start
            - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr internal://redpanda:9092,external://redpanda:19092
            - --rpc-addr redpanda:33145
            - --advertise-rpc-addr redpanda:33145
            - --smp 2
            - --memory 1G
            - --default-log-level=warn
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 19092
              name: kafka-external
            - containerPort: 9644
              name: admin
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "rpk cluster health | grep -E 'Healthy:.+true'"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp2
        resources:
          requests:
            storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: fuelchain
spec:
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: kafka-external
      port: 19092
      targetPort: 19092
    - name: admin
      port: 9644
      targetPort: 9644
  type: ClusterIP
  clusterIP: None   # Headless

---
# HorizontalPodAutoscaler for backend API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: fuelchain
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# PodDisruptionBudget — keep at least 1 backend replica during node maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: fuelchain
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
